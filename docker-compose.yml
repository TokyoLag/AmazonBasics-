services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: amazon_cart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: amazon_cart
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      - db
volumes:
  pgdata:
